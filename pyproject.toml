[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "carpool-matching-engine"
version = "0.2.0"
description = "Provider-neutral carpool assignment and route-ordering engine built on OR-Tools."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [{ name = "Pablo Thiermann" }]
dependencies = ["ortools==9.15.6755"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "build==1.5.0",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.8",
]

[project.urls]
Homepage = "https://github.com/IchoTolotos/carpool-matching-engine"
Issues = "https://github.com/IchoTolotos/carpool-matching-engine/issues"
Repository = "https://github.com/IchoTolotos/carpool-matching-engine.git"

[tool.hatch.build.targets.wheel]
packages = ["src/carpool_matching_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D100",
  "D104",
  "D105",
  "D107",
  "D203",
  "D213",
  "FBT003",
  "TC001",
  "TC003",
]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**" = ["T201"]
"examples/**" = ["T201"]
"tests/**" = ["D", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "benchmarks", "examples", "tests"]

[[tool.mypy.overrides]]
module = ["ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=carpool_matching_engine --cov-report=term-missing --cov-fail-under=90"
filterwarnings = [
  "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["carpool_matching_engine"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
show_missing = true
