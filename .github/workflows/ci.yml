name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.20.0
          runtime: node@22.22.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
